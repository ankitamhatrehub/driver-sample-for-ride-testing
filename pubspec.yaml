name: rider_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.6+10

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  image_picker: ^1.1.2
  camera: ^0.11.2
  google_mlkit_face_detection: ^0.13.1
  google_mlkit_text_recognition: ^0.15.0
  shared_preferences: ^2.2.3
  local_auth: ^2.1.6
  google_maps_flutter: ^2.17.1
  geolocator: ^14.0.3
  geocoding: ^4.0.0
  razorpay_flutter: ^1.4.5
  share_plus: ^13.2.1
  path_provider: ^2.1.2
  pdf: ^3.11.1
  url_launcher: ^6.3.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.14.1
  audioplayers: ">=6.7.1 <6.8.0"
  flutter_local_notifications: ^22.2.0
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1
  go_router: ^17.5.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  file_saver: ^0.7.0

dependency_overrides:
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/coming_soon/
    - assets/images/app_logo.png
    - assets/welcome_car_city.png
    - assets/car_porsche.png
    - assets/car_toyota.png
    - assets/logo.jpeg
    - assets/delivery_boy.jpg
    - assets/language_select.jpg
    - assets/cab.png
    - assets/ev_cab.png
    - assets/xl_cab.png
    - assets/auto.png
    - assets/bike.png
    - assets/digilocker.png
    - assets/kyc_guide_banner.png
    - assets/call_icon.png
    - assets/chat_icon.png
    - assets/nav_next_icon.png
    - assets/sounds/ride_alert.wav
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-Bold.ttf
          weight: 700
