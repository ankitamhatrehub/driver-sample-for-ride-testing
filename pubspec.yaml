name: rider_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.0
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  local_auth: ^2.1.6
  google_maps_flutter: ^2.17.1
  geolocator: ^14.0.3
  razorpay_flutter: ^1.4.5
  share_plus: ^13.2.1
  url_launcher: ^6.3.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  webview_flutter: ^4.14.1
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.2.0
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1

dependency_overrides:
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.jpeg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/welcome_car_city.png
    - assets/car_porsche.png
    - assets/car_toyota.png
    - assets/logo.jpeg
    - assets/sounds/ride_alert.wav
    - assets/sounds/makabhosda_aag.wav
